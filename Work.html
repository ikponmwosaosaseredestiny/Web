<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Industry Experience</title>

    <!-- Bootstrap 5 CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet" href="/css/gallery.css">
</head>

<body>

    <main class="gallery-page">

        <div class="container py-5">

            <!-- Back Button -->
            <div class="mb-5">
                <button class="btn btn-outline-dark rounded-pill px-4" onclick="goBack()">
                    <i class="fa-solid fa-arrow-left me-2"></i>
                    Go Back
                </button>
            </div>

            <!-- Gallery Heading -->
            <div class="gallery-heading text-center mb-5">

                <span class="badge rounded-pill bg-primary-subtle text-primary px-3 py-2 mb-3">
                    Industry Experience
                </span>

                <h1 class="fw-bold">A & K Construction Limited | Museum of West African Art (MOWAA) Project Gallery</h1>

                <p class="text-secondary mx-auto">
                    A visual collection of my Industry experience, activities and contributions.
                </p>

            </div>

            <!-- Image Gallery -->
            <div class="row g-4" id="galleryGrid">

                <!-- JavaScript dynamically inserts images here -->

            </div>

        </div>

    </main>


    <!-- =================================
              IMAGE VIEWER MODAL
    ================================== -->

    <div class="modal fade" id="imageModal" tabindex="-1" aria-hidden="true">

        <div class="modal-dialog modal-xl modal-dialog-centered">

            <div class="modal-content gallery-modal">

                <!-- Modal Header -->
                <div class="modal-header border-0">

                    <div>
                        <h5 class="modal-title fw-bold" id="imageTitle">
                            Image Title
                        </h5>

                        <small class="text-secondary" id="imageCounter">
                            1 of 10
                        </small>
                    </div>

                    <button type="button" class="btn-close" data-bs-dismiss="modal">
                    </button>

                </div>

                <!-- Image Display -->
                <div class="modal-body text-center">

                    <div class="image-viewer">

                        <button class="viewer-arrow prev-arrow" onclick="previousImage()">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>

                        <img id="fullImage" src="" alt="Full project image">

                        <button class="viewer-arrow next-arrow" onclick="nextImage()">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>

                    </div>

                    <p class="image-description mt-3" id="imageDescription">
                    </p>

                </div>

            </div>

        </div>

    </div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Custom JS -->
    <script src="/js/gallery.js"></script>

</body>

</html>
